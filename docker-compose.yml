version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: trustverse-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=trustverse
    volumes:
      - mongo_data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: trustverse-ai-service
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustverse-backend
    ports:
      - "5000:5000"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/trustverse
      - AI_SERVICE_URL=http://ai-service:8000
      - BLOCKCHAIN_RPC_URL=https://rpc-amoy.polygon.technology
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustverse-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
